<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyArch ERP - KeyRenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="bg-[#0f172a] border-b border-[#1e2d54] p-4 text-center sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-white">KeyArch ERP</h1>
        <p class="text-xs text-blue-400">Internal Operational Management System</p>
    </header>

    <main class="container mx-auto p-4 md:p-6 max-w-6xl flex-grow">
        <!-- Dashboard View -->
        <section id="sec-dashboard" class="space-y-6">
            <div class="card-dark p-6 rounded-2xl text-center shadow-lg">
                <h2 class="text-3xl font-bold text-white">KeyRenta</h2>
                <p class="text-sm text-gray-400 mt-1">Manage your properties with ease</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Overview Stats -->
                <div class="card-dark p-6 rounded-2xl">
                    <h3 class="text-lg font-semibold text-white mb-4">Overview</h3>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="p-4 bg-[#172447] rounded-xl">
                            <div class="text-xs text-gray-400">Rental Properties</div>
                            <div id="stat-properties" class="text-2xl font-bold text-blue-400">0</div>
                        </div>
                        <div class="p-4 bg-[#172447] rounded-xl">
                            <div class="text-xs text-gray-400">Tenants</div>
                            <div id="stat-tenants" class="text-2xl font-bold text-purple-400">0</div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="card-dark p-6 rounded-2xl">
                    <h3 class="text-lg font-semibold text-white mb-4">Quick Actions</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="openModal('modal-property')" class="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl flex flex-col items-center justify-center space-y-2">
                            <i class="fa-solid fa-house-plus text-2xl"></i>
                            <span class="text-xs font-medium">Add Property</span>
                        </button>
                        <button onclick="openModal('modal-tenant')" class="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl flex flex-col items-center justify-center space-y-2">
                            <i class="fa-solid fa-user-plus text-2xl"></i>
                            <span class="text-xs font-medium">Add Tenant</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Property List -->
            <div class="card-dark p-6 rounded-2xl">
                <h3 class="text-lg font-semibold text-white mb-4">Property Portfolio</h3>
                <div id="property-list" class="space-y-3">
                    <p class="text-xs text-gray-400">Inapakia majengo...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Add Property -->
    <div id="modal-property" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="card-dark w-full max-w-md rounded-2xl p-6 space-y-4 relative">
            <button onclick="closeModal('modal-property')" class="absolute top-4 right-4 text-gray-400 text-xl">&times;</button>
            <h3 class="font-bold text-lg text-white">Sajili Jengo Jipya</h3>
            <form id="form-property" class="space-y-3">
                <input type="text" id="prop-title" placeholder="Jina la Jengo (mfano: HUGO)" class="w-full p-3 rounded-xl input-dark text-sm" required>
                <input type="text" id="prop-location" placeholder="Eneo (mfano: MBEZI BEACH)" class="w-full p-3 rounded-xl input-dark text-sm" required>
                <select id="prop-category" class="w-full p-3 rounded-xl input-dark text-sm">
                    <option value="Apartment">Apartment</option>
                    <option value="House">House</option>
                    <option value="Office">Office</option>
                </select>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl text-white font-semibold">Hifadhi kwenye Database</button>
            </form>
        </div>
    </div>

    <!-- Modal Add Tenant -->
    <div id="modal-tenant" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="card-dark w-full max-w-md rounded-2xl p-6 space-y-4 relative">
            <button onclick="closeModal('modal-tenant')" class="absolute top-4 right-4 text-gray-400 text-xl">&times;</button>
            <h3 class="font-bold text-lg text-white">Sajili Mpangaji Jipya</h3>
            <form id="form-tenant" class="space-y-3">
                <input type="text" id="tenant-name" placeholder="Jina Kamili" class="w-full p-3 rounded-xl input-dark text-sm" required>
                <input type="text" id="tenant-nida" placeholder="NIDA / Passport Number" class="w-full p-3 rounded-xl input-dark text-sm" required>
                <input type="tel" id="tenant-phone" placeholder="Namba ya Simu" class="w-full p-3 rounded-xl input-dark text-sm" required>
                <input type="email" id="tenant-email" placeholder="Barua Pepe (BaruaPepe)" class="w-full p-3 rounded-xl input-dark text-sm">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl text-white font-semibold">Hifadhi Mpangaji</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
