<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEY ARCH ERP — System Access & Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#060c18] text-gray-100 font-sans">

    <!-- VIEW 1: LOGIN SCREEN (Default View) -->
    <div id="view-login" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-[#0a1224] border border-[#182848] w-full max-w-md rounded-2xl p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-1">
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-cyan-400">
                    KEY ARCH <span class="text-xs font-semibold px-2 py-0.5 rounded bg-blue-600/30 border border-blue-500/50 text-blue-300 align-middle">ERP</span>
                </h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest">Internal Operations Portal</p>
            </div>

            <div id="login-error" class="hidden p-3 bg-red-900/50 border border-red-500/50 rounded-xl text-xs text-red-300 text-center"></div>

            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="login-email" value="admin@keyarch.co.tz" class="w-full p-3 rounded-xl bg-[#14223d] border border-[#233863] text-white text-sm focus:border-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
                    <input type="password" id="login-password" value="Admin@2026" class="w-full p-3 rounded-xl bg-[#14223d] border border-[#233863] text-white text-sm focus:border-blue-500 outline-none" required>
                </div>
                <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-sm shadow-lg transition">
                    Sign In to Portal &rarr;
                </button>
            </form>
            <div class="text-center text-[11px] text-gray-500">
                Default Credentials: <span class="text-gray-300 font-mono">admin@keyarch.co.tz</span> / <span class="text-gray-300 font-mono">Admin@2026</span>
            </div>
        </div>
    </div>

    <!-- VIEW 2: MAIN SYSTEM DASHBOARD (Hidden until logged in) -->
    <div id="view-app" class="hidden flex-col min-h-screen justify-between">
        
        <!-- TOP HEADER -->
        <header class="bg-[#0a1224]/90 backdrop-blur-md border-b border-[#182848] px-6 py-4 sticky top-0 z-40 shadow-2xl flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span id="user-role-badge" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-blue-900/80 border border-blue-500 text-blue-300 uppercase">SUPER_ADMIN</span>
                <span id="user-name-display" class="text-xs font-bold text-white hidden md:inline">Hugo Mlula</span>
            </div>
            
            <div class="text-center">
                <h1 class="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-cyan-400">
                    KEY ARCH <span class="text-xs font-semibold px-1.5 py-0.5 rounded bg-blue-600/30 border border-blue-500/50 text-blue-300">ERP</span>
                </h1>
            </div>

            <button onclick="logout()" class="bg-red-900/40 hover:bg-red-800/60 border border-red-500/50 px-3 py-1.5 rounded-xl text-xs font-bold text-red-300 flex items-center gap-1.5 transition">
                <i class="fa-solid fa-power-off"></i> <span class="hidden md:inline">Sign Out</span>
            </button>
        </header>

        <!-- MAIN DASHBOARD CONTENT -->
        <main class="container mx-auto p-4 md:p-6 max-w-6xl flex-grow">
            <section class="space-y-6">
                
                <!-- CONTRACT REMINDERS -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="p-4 bg-[#0d172d] border-l-4 border-red-500 rounded-2xl shadow-lg flex justify-between items-center">
                        <div>
                            <div class="text-xs text-gray-400 font-semibold uppercase">Expired Leases</div>
                            <div id="rem-expired" class="text-2xl font-black text-red-400">0</div>
                        </div>
                        <i class="fa-solid fa-file-circle-exclamation text-red-500/30 text-3xl"></i>
                    </div>
                    <div class="p-4 bg-[#0d172d] border-l-4 border-amber-500 rounded-2xl shadow-lg flex justify-between items-center">
                        <div>
                            <div class="text-xs text-gray-400 font-semibold uppercase">Expiring This Week</div>
                            <div id="rem-week" class="text-2xl font-black text-amber-400">0</div>
                        </div>
                        <i class="fa-solid fa-clock-rotate-left text-amber-500/30 text-3xl"></i>
                    </div>
                    <div class="p-4 bg-[#0d172d] border-l-4 border-blue-500 rounded-2xl shadow-lg flex justify-between items-center">
                        <div>
                            <div class="text-xs text-gray-400 font-semibold uppercase">Expiring This Month</div>
                            <div id="rem-month" class="text-2xl font-black text-blue-400">0</div>
                        </div>
                        <i class="fa-solid fa-calendar-check text-blue-500/30 text-3xl"></i>
                    </div>
                </div>

                <!-- METRICS GRID -->
                <div class="grid grid-cols-2 md:grid-cols-6 gap-3 text-center">
                    <div class="p-3 bg-[#0d172d] border border-[#182848] rounded-2xl">
                        <div class="text-[10px] text-gray-400 uppercase">Properties</div>
                        <div id="stat-properties" class="text-lg font-bold text-blue-400">0</div>
                    </div>
                    <div class="p-3 bg-[#0d172d] border border-[#182848] rounded-2xl">
                        <div class="text-[10px] text-gray-400 uppercase">Active Tenants</div>
                        <div id="stat-tenants" class="text-lg font-bold text-emerald-400">0</div>
                    </div>
                    <div class="p-3 bg-[#0d172d] border border-[#182848] rounded-2xl">
                        <div class="text-[10px] text-gray-400 uppercase">Open Tickets</div>
                        <div id="stat-tickets" class="text-lg font-bold text-amber-400">0</div>
                    </div>
                    <div class="p-3 bg-[#0d172d] border border-[#182848] rounded-2xl">
                        <div class="text-[10px] text-gray-400 uppercase">Total Income</div>
                        <div id="stat-income" class="text-sm font-bold text-emerald-400">TZS 0</div>
                    </div>
                    <div class="p-3 bg-[#0d172d] border border-[#182848] rounded-2xl">
                        <div class="text-[10px] text-gray-400 uppercase">Total Expenses</div>
                        <div id="stat-expense" class="text-sm font-bold text-red-400">TZS 0</div>
                    </div>
                    <div class="p-3 bg-[#0d172d] border border-[#182848] rounded-2xl">
                        <div class="text-[10px] text-gray-400 uppercase">Net Profit</div>
                        <div id="stat-profit" class="text-sm font-bold text-cyan-400">TZS 0</div>
                    </div>
                </div>

            </section>
        </main>

        <!-- BOTTOM NAV -->
        <nav class="bg-[#0a1224]/95 border-t border-[#182848] py-3 sticky bottom-0 z-40 backdrop-blur-md">
            <div class="max-w-md mx-auto flex justify-between items-center px-6 text-[10px] font-semibold text-gray-400">
                <button class="text-blue-400 flex flex-col items-center"><i class="fa-solid fa-chart-line text-base mb-1"></i>Home</button>
                <button class="hover:text-white flex flex-col items-center"><i class="fa-solid fa-building text-base mb-1"></i>Properties</button>
                <button class="hover:text-white flex flex-col items-center"><i class="fa-solid fa-users text-base mb-1"></i>Tenants</button>
                <button class="hover:text-white flex flex-col items-center"><i class="fa-solid fa-wallet text-base mb-1"></i>Accounts</button>
                <button class="hover:text-white flex flex-col items-center"><i class="fa-solid fa-wrench text-base mb-1"></i>Tickets</button>
                <button class="hover:text-white flex flex-col items-center"><i class="fa-solid fa-sliders text-base mb-1"></i>Settings</button>
            </div>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('keyarch_token');
            if (token) {
                showAppView();
            }

            document.getElementById('form-login').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const errBox = document.getElementById('login-error');

                errBox.classList.add('hidden');

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        errBox.innerText = data.error || 'Login failed';
                        errBox.classList.remove('hidden');
                        return;
                    }

                    localStorage.setItem('keyarch_token', data.token);
                    localStorage.setItem('keyarch_user', JSON.stringify(data.user));
                    showAppView();
                } catch (err) {
                    errBox.innerText = 'Server Error! Jaribu tena baadaye.';
                    errBox.classList.remove('hidden');
                }
            });
        });

        async function showAppView() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-app').classList.remove('hidden');
            document.getElementById('view-app').classList.add('flex');

            const user = JSON.parse(localStorage.getItem('keyarch_user') || '{}');
            document.getElementById('user-role-badge').innerText = user.role || 'USER';
            document.getElementById('user-name-display').innerText = user.full_name || '';

            loadDashboardSummary();
        }

        async function loadDashboardSummary() {
            const token = localStorage.getItem('keyarch_token');
            try {
                const res = await fetch('/api/dashboard/summary', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401 || res.status === 403) {
                    logout();
                    return;
                }
                const data = await res.json();

                document.getElementById('rem-expired').innerText = data.reminders.expired;
                document.getElementById('rem-week').innerText = data.reminders.expiring_week;
                document.getElementById('rem-month').innerText = data.reminders.expiring_month;

                document.getElementById('stat-properties').innerText = data.properties;
                document.getElementById('stat-tenants').innerText = data.tenants;
                document.getElementById('stat-tickets').innerText = data.open_tickets;

                document.getElementById('stat-income').innerText = 'TZS ' + data.financials.total_income.toLocaleString();
                document.getElementById('stat-expense').innerText = 'TZS ' + data.financials.total_expense.toLocaleString();
                document.getElementById('stat-profit').innerText = 'TZS ' + data.financials.net_profit.toLocaleString();
            } catch (err) {
                console.error(err);
            }
        }

        function logout() {
            localStorage.removeItem('keyarch_token');
            localStorage.removeItem('keyarch_user');
            window.location.reload();
        }
    </script>
</body>
</html>
